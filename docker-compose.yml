services:
  ollama-web-client:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama
    networks:
      - ollama-web-client-network

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    networks:
      - ollama-web-client-network

networks:
  ollama-web-client-network: